name: macOS app (DMG)

on:
  push:
    branches: [macos-support]
    tags: ['v*-mac']
  pull_request:
    branches: [macos-support]
  workflow_dispatch:

permissions:
  contents: write  # attach the DMG to releases on tags

jobs:
  build:
    runs-on: macos-15  # Apple Silicon (arm64)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_mac.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_mac.txt pyinstaller==6.16.0

      - name: Smoke test (imports, Core ML provider, UI construction)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import onnxruntime as o; assert 'CoreMLExecutionProvider' in o.get_available_providers(), o.get_available_providers()"
          python - <<'EOF'
          import sys
          sys.argv = ['VisoMaster']
          import main
          from app.ui.widgets import widget_components
          widget_components.LoadLastWorkspaceDialog.exec = lambda self: 0
          app, window = main.create_app(sys.argv)
          assert window.models_processor.provider_name == 'CoreML'
          assert hasattr(window, 'process_controller')
          print('UI OK', flush=True)
          import os
          os._exit(0)  # skip interpreter teardown with live Qt/Core ML objects (segfaults)
          EOF

      - name: Build app and DMG
        env:
          PYTHON: python
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          # v0.1.6-mac -> 0.1.6 for the app's version number
          VERSION="${TAG#v}"
          VERSION="${VERSION%-mac}"
          export VISOMASTER_VERSION="${VERSION:-0.1.6}"
          ./scripts/build_macos_dmg.sh

      - name: Self-test the packaged app (model download, Core ML, ffmpeg)
        env:
          VISOMASTER_SELFTEST: '1'
          QT_QPA_PLATFORM: offscreen
        run: dist/pyinstaller/VisoMaster.app/Contents/MacOS/VisoMaster

      - uses: actions/upload-artifact@v4
        with:
          name: VisoMaster-macOS-arm64
          path: dist/*.dmg
          retention-days: 30

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
